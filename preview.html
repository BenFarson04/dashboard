    const { useEffect, useState } = React;
    // Persist a piece of state to localStorage. Used for settings, tasks and quick links
    // so the mock app remembers user edits between browser sessions.
    function useLocalStorage(key, initialValue) {
        const [value, setValue] = useState(() => {
            try {
                const raw = localStorage.getItem(key);
                return raw != null ? JSON.parse(raw) : initialValue;
            }
            catch {
                return initialValue;
            }
        });
        useEffect(() => {
            try {
                localStorage.setItem(key, JSON.stringify(value));
            }
            catch { /* storage unavailable */ }
        }, [key, value]);
        return [value, setValue];
    }
    return { useLocalStorage };

    function atToday(hours, minutes = 0, dayOffset = 0) {
        const d = new Date();
        d.setDate(d.getDate() + dayOffset);
        d.setHours(hours, minutes, 0, 0);
        return d;
    }
    function isSameDay(a, b) {
        const x = new Date(a), y = new Date(b);
        return x.getFullYear() === y.getFullYear() && x.getMonth() === y.getMonth() && x.getDate() === y.getDate();
    }
    function isToday(d) { return isSameDay(d, new Date()); }

    function fmtTime(d) {
        return new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    }
    function fmtDayLong(d = new Date()) {
        return new Date(d).toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }
    function fmtDayShort(d) {
        return new Date(d).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
    }
    // Human "time ago" / "in x" relative string.
    function relTime(d) {
        const diff = new Date(d).getTime() - Date.now();
        const abs = Math.abs(diff);
        const mins = Math.round(abs / 60000);
        const hrs = Math.round(abs / 3600000);
        const days = Math.round(abs / 86400000);
        let label;
        if (mins < 1)
            label = 'just now';
        else if (mins < 60)
            label = `${mins}m`;
        else if (hrs < 24)
            label = `${hrs}h`;
        else
